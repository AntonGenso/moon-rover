<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Moon Rover: Shield Run — Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#06040f;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;top:0;left:0;width:100vw;height:100dvh;display:flex;justify-content:center;align-items:center;background:#06040f}
  #box{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden}
  @media(min-width:600px){#box{max-height:100vh;aspect-ratio:9/19.5;border-radius:32px;border:2px solid #1a1a2e}}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="wrap"><div id="box"><canvas id="c"></canvas>
<div id="load-screen" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#06040f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity 0.5s ease">
<div style="font-size:20px;font-weight:700;color:#fff;letter-spacing:3px;margin-bottom:6px">MOON ROVER</div>
<div style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:4px;margin-bottom:30px">SHIELD RUN</div>
<div style="width:150px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden"><div id="load-bar" style="height:100%;width:0%;background:#FFA91F;border-radius:2px;transition:width 0.2s ease"></div></div>
</div>
</div></div>
<script>
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var box=document.getElementById('box');
var W=0,H=0,dpr=1;

function resize(){
  var r=box.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
}
window.addEventListener('resize',resize);

/* =====================================================
   SCROLL & CANYON
   ===================================================== */
var scrollY=0;
var BASE_SPEED=170;
var scrollSpeed=BASE_SPEED;

function canyonAt(worldPos){
  var t=worldPos*0.0008;
  var center=0.5+Math.sin(t*1.3)*0.06+Math.sin(t*2.7+1.5)*0.03;
  var width=0.76+Math.sin(t*0.9)*0.08+Math.sin(t*2.1+3.0)*0.04;
  width=Math.max(0.38,Math.min(0.88,width));
  return{left:(center-width/2)*W,right:(center+width/2)*W,center:center*W,width:width*W};
}
function screenToWorld(y){return scrollY+H-y;}
function worldToScreen(wy){return(scrollY+H)-wy;}

/* =====================================================
   TERRAIN TILE
   ===================================================== */
var tileC=document.createElement('canvas');
var tileX=tileC.getContext('2d');
var TILE_S=512;
tileC.width=TILE_S;tileC.height=TILE_S;

function genTerrain(){
  var img=tileX.createImageData(TILE_S,TILE_S);
  var d=img.data;
  for(var i=0;i<TILE_S*TILE_S;i++){
    var base=18+Math.random()*14;
    var s=Math.random();
    if(s>0.997)base+=20;else if(s>0.99)base-=6;
    var idx=i*4;d[idx]=base;d[idx+1]=base-2;d[idx+2]=base+5;d[idx+3]=255;
  }
  tileX.putImageData(img,0,0);
  for(var c=0;c<30;c++){
    var cx=Math.random()*TILE_S,cy=Math.random()*TILE_S,cr=Math.random()*5+1.5;
    tileX.beginPath();tileX.arc(cx,cy,cr,0,Math.PI*2);
    tileX.fillStyle='rgba(12,10,18,0.35)';tileX.fill();
  }
}
genTerrain();

/* =====================================================
   WALL LAYERS — cold blue palette, dark→light from inside→outside
   Layer 0 = innermost (closest to road, darkest)
   Layer 4 = outermost (edge of screen, lightest/iciest)
   ===================================================== */
var WALL_LAYERS=[
  {r:12,g:16,b:38, edge:'#1a2040',inset:0.44},
  {r:20,g:28,b:55, edge:'#253060',inset:0.32},
  {r:32,g:45,b:75, edge:'#3a5080',inset:0.20},
  {r:50,g:68,b:100,edge:'#4a6a95',inset:0.09},
  {r:72,g:98,b:135,edge:'#60b8e8',inset:0.0},
];

var wallTextures=[];
function genWallTexture(l){
  var c=document.createElement('canvas');
  var x=c.getContext('2d');
  c.width=256;c.height=256;
  var base=WALL_LAYERS[l];
  var img=x.createImageData(256,256);
  var d=img.data;
  for(var i=0;i<256*256;i++){
    var noise=(Math.random()-0.5)*18;
    var grain=Math.random()>0.97?20:0;
    var idx=i*4;
    d[idx]=Math.max(0,Math.min(255,base.r+noise+grain));
    d[idx+1]=Math.max(0,Math.min(255,base.g+noise*0.9+grain));
    d[idx+2]=Math.max(0,Math.min(255,base.b+noise*0.7+grain));
    d[idx+3]=255;
  }
  x.putImageData(img,0,0);
  for(var j=0;j<12;j++){
    var cx=Math.random()*256,cy=Math.random()*256,cr=Math.random()*7+2;
    x.beginPath();x.arc(cx,cy,cr,0,Math.PI*2);
    x.fillStyle='rgba(0,0,0,0.1)';x.fill();
  }
  for(var k=0;k<6;k++){
    var sx=Math.random()*256,sy=Math.random()*256;
    x.beginPath();x.moveTo(sx,sy);
    x.lineTo(sx+Math.random()*15-7,sy+Math.random()*15-7);
    x.strokeStyle='rgba(255,255,255,0.05)';x.lineWidth=0.5;x.stroke();
  }
  return c;
}
for(var i=0;i<WALL_LAYERS.length;i++)wallTextures.push(genWallTexture(i));

/* =====================================================
   OBSTACLES — created from crashed big meteors
   ===================================================== */
var obstacles=[];
var impactDust=[];

function addCrashedMeteor(x,y,m){
  var wy=screenToWorld(y);
  obstacles.push({
    worldY:wy,x:x,
    w:m.size*1.8,h:m.size*1.4,
    shape:m.shape,rot:m.rot,
    size:m.size,
    shade:Math.random(),
    /* Pre-generate texture spots so they don't flicker */
    spots:[]
  });
  var ob=obstacles[obstacles.length-1];
  for(var s=0;s<12;s++){
    var sa=Math.random()*Math.PI*2;
    var sr=m.size*(0.6+Math.random()*1.2);
    ob.spots.push({dx:Math.cos(sa)*sr,dy:Math.sin(sa)*sr*0.8,r:1+Math.random()*2.5});
  }
  /* Wide dust cloud */
  for(var d=0;d<40;d++){
    var ang=Math.random()*Math.PI*2;
    var spd=80+Math.random()*200;
    impactDust.push({
      x:x,y:y,
      vx:Math.cos(ang)*spd,
      vy:Math.sin(ang)*spd,
      life:0.8+Math.random()*1.0,
      maxLife:1.2,
      r:2+Math.random()*6
    });
  }
}

function updateImpactDust(dt){
  for(var i=impactDust.length-1;i>=0;i--){
    var p=impactDust[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=0.92;p.vy*=0.92;
    p.life-=dt;
    if(p.life<=0)impactDust.splice(i,1);
  }
}

function drawImpactDust(){
  for(var i=0;i<impactDust.length;i++){
    var p=impactDust[i];
    var a=(p.life/p.maxLife)*0.6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(150,140,120,'+a+')';ctx.fill();
    /* Inner bright core */
    if(p.r>3){
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.4,0,Math.PI*2);
      ctx.fillStyle='rgba(200,180,150,'+(a*0.5)+')';ctx.fill();
    }
  }
}

function cleanObstacles(){
  for(var i=obstacles.length-1;i>=0;i--){
    var sy=worldToScreen(obstacles[i].worldY);
    if(sy>H+100)obstacles.splice(i,1);
  }
}

function drawObstacles(){
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    var sy=worldToScreen(o.worldY);
    if(sy<-60||sy>H+60)continue;
    var sz=o.size||14;

    ctx.save();
    ctx.translate(o.x,sy);

    /* Wavy crater ring */
    ctx.beginPath();
    var ringPts=24;
    for(var p=0;p<ringPts;p++){
      var a=(p/ringPts)*Math.PI*2;
      var wv=sz*2.2+Math.sin(a*5+o.shade*10)*sz*0.35+Math.sin(a*3+o.shade*7)*sz*0.2;
      var rx=Math.cos(a)*wv;
      var ry=Math.sin(a)*wv*0.8;
      if(p===0)ctx.moveTo(rx,ry);else ctx.lineTo(rx,ry);
    }
    ctx.closePath();
    ctx.fillStyle='rgb(55,80,115)';
    ctx.fill();

    /* Rocky texture spots (pre-generated, no flicker) */
    if(o.spots){
      for(var s=0;s<o.spots.length;s++){
        var sp=o.spots[s];
        ctx.beginPath();ctx.arc(sp.dx,sp.dy,sp.r,0,Math.PI*2);
        ctx.fillStyle='rgba(40,60,95,0.6)';ctx.fill();
      }
      /* Lighter spots for texture variation */
      for(var s2=0;s2<o.spots.length;s2+=2){
        var sp2=o.spots[s2];
        ctx.beginPath();ctx.arc(sp2.dx*0.6,sp2.dy*0.6,sp2.r*0.6,0,Math.PI*2);
        ctx.fillStyle='rgba(80,110,150,0.3)';ctx.fill();
      }
    }

    /* Bright blue edge */
    ctx.beginPath();
    for(var p2=0;p2<ringPts;p2++){
      var a2=(p2/ringPts)*Math.PI*2;
      var wv2=sz*2.2+Math.sin(a2*5+o.shade*10)*sz*0.35+Math.sin(a2*3+o.shade*7)*sz*0.2;
      var rx2=Math.cos(a2)*wv2;
      var ry2=Math.sin(a2)*wv2*0.8;
      if(p2===0)ctx.moveTo(rx2,ry2);else ctx.lineTo(rx2,ry2);
    }
    ctx.closePath();
    ctx.strokeStyle='rgba(96,184,232,0.7)';
    ctx.lineWidth=2;
    ctx.stroke();

    /* Brown meteor rock center */
    ctx.rotate(o.rot);
    ctx.beginPath();
    ctx.moveTo(o.shape[0].x*1.1,o.shape[0].y*1.1);
    for(var v=1;v<o.shape.length;v++){
      ctx.lineTo(o.shape[v].x*1.1,o.shape[v].y*1.1);
    }
    ctx.closePath();
    var b=65+o.shade*25;
    ctx.fillStyle='rgb('+Math.floor(b)+','+Math.floor(b*0.65)+','+Math.floor(b*0.4)+')';
    ctx.fill();
    ctx.strokeStyle='rgba(120,80,40,0.4)';
    ctx.lineWidth=1;
    ctx.stroke();

    ctx.restore();
  }
}

/* =====================================================
   ISLANDS — rock formations in the middle of canyon
   Same visual as canyon walls, force player to choose side
   ===================================================== */
var islands=[];
var nextIslandWY=0;
var ISLAND_INTERVAL=1700;

/* Check if a world position is inside any island */
function isInsideIsland(wx,wy){
  for(var i=0;i<islands.length;i++){
    var isl=islands[i];
    if(wy>isl.worldY||wy<isl.worldY-isl.h)continue;
    var frac=(isl.worldY-wy)/isl.h;
    var taper=1-Math.pow(2*frac-1,4);
    var hw=isl.w/2*taper+10;
    if(wx>isl.x-hw&&wx<isl.x+hw)return true;
  }
  return false;
}

/* Check if world Y is near any island */
function isNearIsland(wy,margin){
  for(var i=0;i<islands.length;i++){
    var isl=islands[i];
    if(wy>isl.worldY+margin||wy<isl.worldY-isl.h-margin)continue;
    return true;
  }
  return false;
}

function spawnIslands(){
  var aheadWorld=scrollY+H*4;
  var MIN_PASSAGE=96;
  while(nextIslandWY<aheadWorld){
    var c=canyonAt(nextIslandWY);
    var cMid=(c.left+c.right)/2;
    var cW=c.right-c.left;

    var offsetPct=(Math.random()-0.5)*0.4;
    var islandX=cMid+offsetPct*cW;
    var islandW=cW*0.15+Math.random()*cW*0.15;
    var islandH=300+Math.random()*400;

    /* Ensure both passages are wide enough */
    var leftW=islandX-islandW/2-c.left;
    var rightW=c.right-(islandX+islandW/2);

    if(leftW<MIN_PASSAGE){
      islandX=c.left+MIN_PASSAGE+islandW/2;
      leftW=MIN_PASSAGE;
      rightW=c.right-(islandX+islandW/2);
    }
    if(rightW<MIN_PASSAGE){
      islandX=c.right-MIN_PASSAGE-islandW/2;
      rightW=MIN_PASSAGE;
      leftW=islandX-islandW/2-c.left;
    }
    /* If still too tight, shrink island */
    if(leftW<MIN_PASSAGE||rightW<MIN_PASSAGE){
      islandW=cW-MIN_PASSAGE*2-20;
      islandX=cMid;
      if(islandW<20){nextIslandWY+=ISLAND_INTERVAL;continue;}
    }

    leftW=islandX-islandW/2-c.left;
    rightW=c.right-(islandX+islandW/2);
    var narrowSide=leftW<rightW?'left':'right';
    var rewardTypes=['battery','repair','gold','crystal'];
    var reward=rewardTypes[Math.floor(Math.random()*rewardTypes.length)];

    var edgePtsL=[];
    var edgePtsR=[];
    var steps=Math.ceil(islandH/15);
    for(var s=0;s<=steps;s++){
      var frac=s/steps;
      var taper=1-Math.pow(2*frac-1,4);
      var waveL=Math.sin(frac*12+nextIslandWY*0.01)*4+Math.sin(frac*7+2)*3;
      var waveR=Math.sin(frac*10+nextIslandWY*0.013+3)*4+Math.sin(frac*8+5)*3;
      var hw=islandW/2*taper;
      edgePtsL.push({dy:frac*islandH,dx:-hw+waveL});
      edgePtsR.push({dy:frac*islandH,dx:hw+waveR});
    }

    var spots=[];
    for(var sp=0;sp<20;sp++){
      spots.push({dx:(Math.random()-0.5)*islandW*0.8,dy:Math.random()*islandH,r:1.5+Math.random()*3});
    }

    islands.push({
      worldY:nextIslandWY,x:islandX,w:islandW,h:islandH,
      edgePtsL:edgePtsL,edgePtsR:edgePtsR,spots:spots,
      narrowSide:narrowSide,reward:reward,rewardSpawned:false
    });

    nextIslandWY+=ISLAND_INTERVAL+Math.random()*600;
  }

  /* Clean up passed islands — only when fully off bottom */
  for(var i=islands.length-1;i>=0;i--){
    var topY=worldToScreen(islands[i].worldY);
    if(topY>H+400)islands.splice(i,1);
  }
}

function spawnIslandCollectibles(){
  for(var i=0;i<islands.length;i++){
    var isl=islands[i];
    if(isl.rewardSpawned)continue;
    var topSY=worldToScreen(isl.worldY);
    if(topSY>-H)continue;
    isl.rewardSpawned=true;

    var c=canyonAt(isl.worldY-isl.h*0.5);
    var rewardX;
    if(isl.narrowSide==='left'){
      rewardX=(c.left+isl.x-isl.w/2)/2;
    }else{
      rewardX=(c.right+isl.x+isl.w/2)/2;
    }

    var chosen=null;
    for(var t=0;t<COLLECT_TYPES.length;t++){
      if(COLLECT_TYPES[t].type===isl.reward){chosen=COLLECT_TYPES[t];break;}
    }
    if(!chosen)chosen=COLLECT_TYPES[0];

    /* Place 2-3 collectibles along the narrow side */
    for(var ci=0;ci<3;ci++){
      var wy=isl.worldY-isl.h*0.25-ci*isl.h*0.25;
      collectibles.push({
        worldY:wy,
        x:rewardX+(Math.random()-0.5)*20,
        type:chosen.type,color:chosen.color,glowColor:chosen.glowColor,
        pts:chosen.pts,energy:chosen.energy,shieldRestore:chosen.shield,
        lives:chosen.lives||0,size:chosen.size,
        phase:Math.random()*Math.PI*2
      });
    }
  }
}

function drawIslands(){
  for(var i=0;i<islands.length;i++){
    var isl=islands[i];
    var topSY=worldToScreen(isl.worldY);
    var botSY=worldToScreen(isl.worldY-isl.h);
    if(topSY>H+200&&botSY>H+200)continue;
    if(topSY<-200&&botSY<-200)continue;

    ctx.save();
    ctx.translate(isl.x,topSY);

    /* Draw layers: outermost (lightest, widest) first, innermost (darkest) last */
    for(var l=0;l<WALL_LAYERS.length;l++){
      var expand=(WALL_LAYERS.length-1-l)*4;
      var texOff=scrollY%256;

      ctx.beginPath();
      for(var p=0;p<isl.edgePtsL.length;p++){
        var pt=isl.edgePtsL[p];
        if(p===0)ctx.moveTo(pt.dx-expand,pt.dy);
        else ctx.lineTo(pt.dx-expand,pt.dy);
      }
      for(var p2=isl.edgePtsR.length-1;p2>=0;p2--){
        var pt2=isl.edgePtsR[p2];
        ctx.lineTo(pt2.dx+expand,pt2.dy);
      }
      ctx.closePath();

      /* Fill with wall texture */
      var pat=ctx.createPattern(wallTextures[l],'repeat');
      ctx.fillStyle=pat;
      ctx.save();ctx.translate(-isl.x,texOff-topSY);ctx.fill();ctx.restore();

      /* Edge styling */
      ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle=WALL_LAYERS[l].edge;ctx.lineWidth=1.2;ctx.stroke();
    }

    /* Bright blue edge on topmost (innermost) layer */
    ctx.beginPath();
    for(var p3=0;p3<isl.edgePtsL.length;p3++){
      var pt3=isl.edgePtsL[p3];
      if(p3===0)ctx.moveTo(pt3.dx,pt3.dy);else ctx.lineTo(pt3.dx,pt3.dy);
    }
    for(var p4=isl.edgePtsR.length-1;p4>=0;p4--){
      ctx.lineTo(isl.edgePtsR[p4].dx,isl.edgePtsR[p4].dy);
    }
    ctx.closePath();
    ctx.strokeStyle='rgba(96,184,232,0.7)';ctx.lineWidth=2;ctx.stroke();

    ctx.restore();
  }
}

function checkIslandCollision(){
  var half=rover.hitSize/2;
  for(var i=0;i<islands.length;i++){
    var isl=islands[i];
    var topSY=worldToScreen(isl.worldY);
    var botSY=worldToScreen(isl.worldY-isl.h);

    if(rover.y-half>botSY||rover.y+half<topSY)continue;

    var frac=(rover.y-topSY)/(botSY-topSY);
    frac=Math.max(0,Math.min(1,frac));
    var taper=1-Math.pow(2*frac-1,4);
    var hw=isl.w/2*taper+6;

    var leftEdge=isl.x-hw;
    var rightEdge=isl.x+hw;

    if(rover.x+half>leftEdge&&rover.x-half<rightEdge){
      /* Push out */
      if(rover.x<isl.x) rover.x=leftEdge-half;
      else rover.x=rightEdge+half;
      /* Lose life like wall */
      if(rover.invuln<=0){
        rover.lives--;rover.invuln=1.5;
        if(rover.lives<0)rover.lives=0;
        vfxShake(8,0.3);vfxRedFlash();
      }
      break;
    }
  }
}

/* =====================================================
   STARS
   ===================================================== */
var bgStars=[];
for(var i=0;i<50;i++)bgStars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.3,p:Math.random()*6.28,sp:Math.random()*0.006+0.002});

/* =====================================================
   DRAW CANYON
   ===================================================== */
function drawCanyon(){
  ctx.fillStyle='#06040f';
  ctx.fillRect(0,0,W,H);

  for(var i=0;i<bgStars.length;i++){
    var s=bgStars[i];
    var a=0.2+0.5*Math.abs(Math.sin(s.p+gameTime*s.sp));
    ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();
  }

  /* Terrain floor */
  var tileOff=scrollY%TILE_S;
  ctx.save();
  ctx.beginPath();
  for(var y=0;y<=H;y+=4){
    var wY=screenToWorld(y);var c=canyonAt(wY);
    if(y===0)ctx.moveTo(c.left-20,y);else ctx.lineTo(c.left-20,y);
  }
  for(var y2=H;y2>=0;y2-=4){
    var wY2=screenToWorld(y2);var c2=canyonAt(wY2);
    ctx.lineTo(c2.right+20,y2);
  }
  ctx.closePath();ctx.clip();
  for(var ty=-TILE_S+tileOff;ty<H+TILE_S;ty+=TILE_S){
    ctx.drawImage(tileC,0,ty,W,TILE_S);
  }
  ctx.restore();

  /* Walls: layer 0 (widest/darkest) first, layer 4 (narrowest/lightest) last */
  for(var l=0;l<WALL_LAYERS.length;l++) drawWallLayer(l);
}

function drawWallLayer(l){
  var layer=WALL_LAYERS[l];
  var tex=wallTextures[l];
  /* Each layer has unique wave: different frequency, phase, amplitude */
  var waveAmp=6+l*3;
  var waveFreq=0.008+l*0.003;
  var wavePhase=l*2.1;
  var layerInset=layer.inset*W;
  var texOff=scrollY%256;

  /* LEFT WALL */
  ctx.save();
  ctx.beginPath();ctx.moveTo(0,0);
  for(var y=0;y<=H;y+=6){
    var wY=screenToWorld(y);
    var cBase=canyonAt(wY);
    var wave=Math.sin(wY*waveFreq+wavePhase)*waveAmp+Math.sin(wY*(waveFreq*2.3)+wavePhase+3.0)*waveAmp*0.35;
    ctx.lineTo(cBase.left-layerInset+wave,y);
  }
  ctx.lineTo(0,H);ctx.closePath();

  var pat=ctx.createPattern(tex,'repeat');
  ctx.fillStyle=pat;
  ctx.save();ctx.translate(0,texOff);ctx.fill();ctx.restore();

  /* Shadow inside edge */
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=4;ctx.stroke();
  ctx.strokeStyle=layer.edge;ctx.lineWidth=l===4?2.5:1.0;ctx.stroke();
  ctx.restore();

  /* RIGHT WALL */
  ctx.save();
  ctx.beginPath();ctx.moveTo(W,0);
  for(var y3=0;y3<=H;y3+=6){
    var wY3=screenToWorld(y3);
    var cBase3=canyonAt(wY3);
    var wave3=Math.sin(wY3*(waveFreq*1.1)+wavePhase+4.5)*waveAmp+Math.sin(wY3*(waveFreq*2.5)+wavePhase+1.5)*waveAmp*0.35;
    ctx.lineTo(cBase3.right+layerInset-wave3,y3);
  }
  ctx.lineTo(W,H);ctx.closePath();

  var pat2=ctx.createPattern(tex,'repeat');
  ctx.fillStyle=pat2;
  ctx.save();ctx.translate(0,texOff);ctx.fill();ctx.restore();

  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=4;ctx.stroke();
  ctx.strokeStyle=layer.edge;ctx.lineWidth=l===4?2.5:1.0;ctx.stroke();
  ctx.restore();
}

   ROVER
   ===================================================== */
var rover={x:0,y:0,drawSize:100,hitSize:48,speed:220,vx:0,vy:0,tvx:0,tvy:0,energy:100,lives:5,invuln:0};
var roverImg=new Image();
roverImg.src='public/assets/rover.png';
function initRover(){rover.x=W/2;rover.y=H*0.65;}

function updateRover(dt){
  scrollSpeed=BASE_SPEED;

  if(isMobile){
    /* Touch: positional — finger delta * multiplier moves rover directly */
    if(touch.on){
      var dx=(touch.cx-touch.ox)*TOUCH_MULT;
      var dy=(touch.cy-touch.oy)*TOUCH_MULT;
      rover.x=touch.roverStartX+dx;
      rover.y=touch.roverStartY+dy;
    }
  }else{
    /* PC: keyboard instant movement */
    var mx=inputMove.x,my=inputMove.y;
    rover.x+=mx*rover.speed*dt;
    rover.y+=my*rover.speed*dt;
  }

  /* Clamp to canyon walls */
  var half=rover.hitSize/2;
  var roverWorldY=screenToWorld(rover.y);
  var c=canyonAt(roverWorldY);
  var margin=6;
  if(rover.x-half<c.left+margin){rover.x=c.left+margin+half;wallHit();}
  if(rover.x+half>c.right-margin){rover.x=c.right-margin-half;wallHit();}

  /* Clamp to screen edges */
  var drawHalf=rover.drawSize/2;
  if(rover.y-drawHalf<H*0.02)rover.y=H*0.02+drawHalf;
  if(rover.y+drawHalf>H*0.95)rover.y=H*0.95-drawHalf;

  checkObstacleCollision();
  if(rover.invuln>0)rover.invuln-=dt;
}

function wallHit(){
  if(rover.invuln>0)return;
  rover.lives--;rover.invuln=1.5;if(rover.lives<0)rover.lives=0;
  vfxShake(8,0.3);vfxRedFlash();
}

function checkObstacleCollision(){
  if(rover.invuln>0)return;
  var half=rover.hitSize/2;
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];var sy=worldToScreen(o.worldY);
    var dx=rover.x-o.x,dy=rover.y-sy;
    var craterR=(o.size||14)*2.6+half*0.3;
    if(dx*dx+dy*dy<craterR*craterR){
      rover.lives--;rover.invuln=1.5;if(rover.lives<0)rover.lives=0;
      vfxShake(6,0.25);vfxRedFlash();
      break;
    }
  }
}

function drawRover(){
  if(rover.invuln>0&&Math.sin(rover.invuln*20)>0)return;
  var sx=rover.x,sy=rover.y,half=rover.drawSize/2;
  if(roverImg.naturalWidth>0){
    ctx.drawImage(roverImg,sx-half,sy-half,rover.drawSize,rover.drawSize);
  }else{
    ctx.fillStyle='#777';ctx.beginPath();ctx.roundRect(sx-half,sy-half,rover.drawSize,rover.drawSize,8);ctx.fill();
    ctx.fillStyle='#aaa';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('ROVER',sx,sy+4);
  }
}

/* =====================================================
   METEORS — fly from all sides, dodge them
   ===================================================== */
var meteors=[];
var meteorTimer=0;
var meteorInterval=2.0;

function getMeteorInterval(){
  if(gameTime<10)return 999;
  if(gameTime<40)return 2.0;
  if(gameTime<70)return 1.5;
  if(gameTime<100)return 1.0;
  if(gameTime<130)return 0.7;
  return 0.5;
}

function spawnMeteor(){
  var side=Math.floor(Math.random()*4);
  var mx,my,vx,vy,sz;
  var speed=80+Math.random()*60+Math.min(gameTime*0.5,60);
  var big=Math.random()<(gameTime>60?0.35:gameTime>15?0.25:0);

  if(big){
    mx=W*0.15+Math.random()*W*0.7;
    my=-40;
    speed=180+Math.random()*100;
    sz=22+Math.random()*10;
  }else{
    if(side===0){mx=Math.random()*W;my=-30;}
    else if(side===1){mx=Math.random()*W;my=H+30;}
    else if(side===2){mx=-30;my=Math.random()*H;}
    else{mx=W+30;my=Math.random()*H;}
  }

  var dx=rover.x-mx+(Math.random()-0.5)*W*0.4;
  var dy=rover.y-my+(Math.random()-0.5)*H*0.4;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>0){vx=dx/dist*speed;vy=dy/dist*speed;}
  else{vx=0;vy=speed;}

  if(!big) sz=8+Math.random()*6;
  var dmg=big?25:10;

  var verts=big?7:5;
  var shape=[];
  for(var i=0;i<verts;i++){
    var a=(i/verts)*Math.PI*2;
    var r=sz*(0.7+Math.random()*0.3);
    shape.push({x:Math.cos(a)*r,y:Math.sin(a)*r});
  }

  meteors.push({
    x:mx,y:my,vx:vx,vy:vy,
    startX:mx,startY:my,
    size:sz,dmg:dmg,big:big,
    shape:shape,
    rot:Math.random()*Math.PI*2,
    rotSpeed:(Math.random()-0.5)*4,
    trail:[],landed:false
  });
}

function updateMeteors(dt){
  meteorInterval=getMeteorInterval();
  meteorTimer+=dt;
  if(meteorTimer>=meteorInterval&&meteors.length<5){
    meteorTimer=0;
    spawnMeteor();
  }

  for(var i=meteors.length-1;i>=0;i--){
    var m=meteors[i];
    m.x+=m.vx*dt;
    m.y+=m.vy*dt;
    m.rot+=m.rotSpeed*dt;

    /* Trail */
    m.trail.push({x:m.x,y:m.y,life:0.3});
    if(m.trail.length>8)m.trail.shift();
    for(var t=m.trail.length-1;t>=0;t--){
      m.trail[t].life-=dt;
      if(m.trail[t].life<=0)m.trail.splice(t,1);
    }

    /* Off screen or crash into surface */
    if(m.x<-80||m.x>W+80||m.y<-80||m.y>H+80){
      if(m.big&&m.y>H*0.1&&m.y<H*0.5){
        var rwy=screenToWorld(m.y);
        var cc=canyonAt(rwy);
        if(m.x>cc.left+10&&m.x<cc.right-10&&!isNearIsland(rwy,200)&&!isInsideIsland(m.x,rwy)){
          addCrashedMeteor(m.x,m.y,m);
        }
      }
      meteors.splice(i,1);continue;
    }

    /* Big meteor landed on road upper half */
    if(m.big&&!m.landed){
      var rwy2=screenToWorld(m.y);
      var cc2=canyonAt(rwy2);
      var travelDist=Math.sqrt((m.x-m.startX)*(m.x-m.startX)+(m.y-m.startY)*(m.y-m.startY));
      if(travelDist>H*0.5&&m.x>cc2.left+15&&m.x<cc2.right-15&&m.y>H*0.1&&m.y<H*0.45&&!isNearIsland(rwy2,200)&&!isInsideIsland(m.x,rwy2)){
        addCrashedMeteor(m.x,m.y,m);
        meteors.splice(i,1);continue;
      }
    }

    /* Rover collision */
    var dx=m.x-rover.x;
    var dy=m.y-rover.y;
    var dist=Math.sqrt(dx*dx+dy*dy);

    if(dist<rover.hitSize*0.4+m.size*0.4){
      if(rover.invuln<=0){
        rover.lives--;
        rover.invuln=1.5;
        if(rover.lives<0)rover.lives=0;
        vfxShake(10,0.35);vfxRedFlash();
      }
      meteors.splice(i,1);
      continue;
    }
  }
}

function drawMeteors(){
  for(var i=0;i<meteors.length;i++){
    var m=meteors[i];

    /* Trail */
    for(var t=0;t<m.trail.length;t++){
      var tr=m.trail[t];
      var ta=tr.life/0.3*0.3;
      var ts=m.size*(0.3+tr.life/0.3*0.4);
      ctx.beginPath();ctx.arc(tr.x,tr.y,ts,0,Math.PI*2);
      ctx.fillStyle='rgba(255,120,30,'+ta+')';ctx.fill();
    }

    /* Meteor body */
    ctx.save();
    ctx.translate(m.x,m.y);
    ctx.rotate(m.rot);
    ctx.beginPath();
    ctx.moveTo(m.shape[0].x,m.shape[0].y);
    for(var v=1;v<m.shape.length;v++){
      ctx.lineTo(m.shape[v].x,m.shape[v].y);
    }
    ctx.closePath();

    var baseR=m.big?90:70,baseG=m.big?55:45,baseB=m.big?35:30;
    ctx.fillStyle='rgb('+baseR+','+baseG+','+baseB+')';
    ctx.fill();
    ctx.strokeStyle='rgba(140,90,50,0.5)';
    ctx.lineWidth=1;
    ctx.stroke();

    /* Highlight edge */
    ctx.strokeStyle='rgba(200,140,80,0.25)';
    ctx.lineWidth=0.5;
    ctx.stroke();

    ctx.restore();

    /* Glow */
    ctx.beginPath();ctx.arc(m.x,m.y,m.size*1.2,0,Math.PI*2);
    ctx.fillStyle=m.deflected?'rgba(255,169,31,0.08)':'rgba(255,100,30,0.06)';
    ctx.fill();
  }
}

/* =====================================================
   COLLECTIBLES — spawn on road, scroll with world
   crystal=+5pts, battery=+25energy, gold=+10pts, heart=+1life
   ===================================================== */
var collectibles=[];
var nextCollectWY=0;
var score=0;
var COLLECT_TYPES=[
  {type:'crystal', color:'#ffd700',glowColor:'rgba(255,215,0,0.15)', pts:5, energy:0, lives:0, freq:0.55, size:8},
  {type:'battery', color:'#00ee77',glowColor:'rgba(0,238,119,0.15)', pts:0, energy:25, lives:0, freq:0.20, size:9},
  {type:'gold',    color:'#fff0a0',glowColor:'rgba(255,240,160,0.2)', pts:10, energy:0, lives:0, freq:0.10, size:11},
  {type:'heart',   color:'#ff4466',glowColor:'rgba(255,68,102,0.2)',  pts:0, energy:0, lives:1, freq:0.03, size:10},
];

function spawnCollectibles(){
  var aheadWorld=scrollY+H*3;
  while(nextCollectWY<aheadWorld){
    var c=canyonAt(nextCollectWY);
    var roll=Math.random();
    var cumul=0;
    var chosen=COLLECT_TYPES[0];
    for(var t=0;t<COLLECT_TYPES.length;t++){
      cumul+=COLLECT_TYPES[t].freq;
      if(roll<cumul){chosen=COLLECT_TYPES[t];break;}
    }
    /* Hearts only spawn if lives < 5 */
    if(chosen.type==='heart'&&rover.lives>=5){chosen=COLLECT_TYPES[0];}
    var cx=c.left+c.width*0.15+Math.random()*c.width*0.7;
    /* Don't spawn inside islands */
    if(isInsideIsland(cx,nextCollectWY)){
      nextCollectWY+=250+Math.random()*150;
      continue;
    }
    collectibles.push({
      worldY:nextCollectWY,
      x:cx,
      type:chosen.type,
      color:chosen.color,
      glowColor:chosen.glowColor,
      pts:chosen.pts,
      energy:chosen.energy,
      shieldRestore:chosen.shield,
      lives:chosen.lives,
      size:chosen.size,
      phase:Math.random()*Math.PI*2
    });
    nextCollectWY+=250+Math.random()*150;
  }
  /* Remove only those far behind (below screen) */
  for(var i=collectibles.length-1;i>=0;i--){
    var sy=worldToScreen(collectibles[i].worldY);
    if(sy>H+100)collectibles.splice(i,1);
  }
}

function updateCollectibles(dt){
  spawnCollectibles();
  var rHalf=rover.hitSize*0.4;

  for(var i=collectibles.length-1;i>=0;i--){
    var col=collectibles[i];
    var sy=worldToScreen(col.worldY);
    var dx=col.x-rover.x;
    var dy=sy-rover.y;
    var dist=Math.sqrt(dx*dx+dy*dy);

    /* Rover body picks up */
    if(dist<rHalf+col.size){
      score=Math.min(240,score+col.pts);
      rover.energy=Math.min(100,rover.energy+col.energy);
      rover.lives=Math.min(5,rover.lives+(col.lives||0));
      var popText=col.pts>0?'+'+col.pts:col.energy>0?'+'+col.energy+'\u26A1':'+1\u2764';
      vfxPickup(col.x,sy,col.color,popText);
      collectibles.splice(i,1);
      continue;
    }
  }
}

function drawCollectibles(){
  for(var i=0;i<collectibles.length;i++){
    var col=collectibles[i];
    var sy=worldToScreen(col.worldY);
    if(sy<-40||sy>H+40)continue;
    var pulse=0.8+0.2*Math.sin(gameTime*4+col.phase);
    var sz=col.size*pulse;

    /* Glow */
    ctx.beginPath();ctx.arc(col.x,sy,sz*2,0,Math.PI*2);
    ctx.fillStyle=col.glowColor;ctx.fill();

    ctx.save();
    ctx.translate(col.x,sy);

    if(col.type==='crystal'){
      /* Diamond shape */
      ctx.rotate(gameTime*1.5+col.phase);
      ctx.beginPath();
      ctx.moveTo(0,-sz);ctx.lineTo(sz*0.7,0);ctx.lineTo(0,sz);ctx.lineTo(-sz*0.7,0);
      ctx.closePath();
      ctx.fillStyle=col.color;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=0.8;ctx.stroke();
    }
    else if(col.type==='battery'){
      /* Lightning bolt */
      var s=sz/7;
      ctx.beginPath();
      ctx.moveTo(s*1,-s*7);ctx.lineTo(-s*3,-s*1);ctx.lineTo(s*0.5,-s*1);
      ctx.lineTo(-s*1,s*7);ctx.lineTo(s*3,s*1);ctx.lineTo(-s*0.5,s*1);
      ctx.closePath();
      ctx.fillStyle=col.color;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.8;ctx.stroke();
    }
    else if(col.type==='repair'){
      /* Hexagonal shield shape */
      var s2=sz/7;
      ctx.beginPath();
      ctx.moveTo(0,-s2*8);ctx.lineTo(s2*7,-s2*5);ctx.lineTo(s2*7,s2*2);
      ctx.lineTo(s2*4,s2*6);ctx.lineTo(0,s2*8);ctx.lineTo(-s2*4,s2*6);
      ctx.lineTo(-s2*7,s2*2);ctx.lineTo(-s2*7,-s2*5);
      ctx.closePath();
      ctx.fillStyle=col.color;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=0.8;ctx.stroke();
    }
    else if(col.type==='gold'){
      /* Star shape */
      ctx.rotate(gameTime*0.8+col.phase);
      ctx.beginPath();
      for(var p=0;p<10;p++){
        var a=(p/10)*Math.PI*2-Math.PI/2;
        var r=p%2===0?sz:sz*0.45;
        if(p===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fillStyle=col.color;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();
    }
    else if(col.type==='heart'){
      /* Angular heart — same as HUD but bigger pulse */
      var sh=sz/8;
      ctx.beginPath();
      ctx.moveTo(0,sh*4);
      ctx.lineTo(-sh*3,sh*1);ctx.lineTo(-sh*6,sh*1);ctx.lineTo(-sh*7,sh*3);
      ctx.lineTo(-sh*7,sh*6);ctx.lineTo(-sh*4,sh*9);ctx.lineTo(0,sh*12);
      ctx.lineTo(sh*4,sh*9);ctx.lineTo(sh*7,sh*6);ctx.lineTo(sh*7,sh*3);
      ctx.lineTo(sh*6,sh*1);ctx.lineTo(sh*3,sh*1);
      ctx.closePath();
      ctx.fillStyle=col.color;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();
    }

    ctx.restore();
  }
}

var tracks=[],trackTimer=0;

function updateTracks(dt){
  for(var i=tracks.length-1;i>=0;i--){
    /* Tracks move in scroll direction */
    tracks[i].sy+=scrollSpeed*dt;
    tracks[i].life-=dt;
    if(tracks[i].life<=0||tracks[i].sy>H+20||tracks[i].sy<-20)tracks.splice(i,1);
  }
  if(rover.vx!==0||Math.abs(scrollSpeed)>10){
    trackTimer+=dt;
    if(trackTimer>0.035){
      trackTimer=0;var half=rover.drawSize*0.3;
      tracks.push({x1:rover.x-half,x2:rover.x+half,sy:rover.y+rover.drawSize*0.4,life:2.5});
    }
  }
}

function drawTracks(){
  for(var i=0;i<tracks.length;i++){
    var t=tracks[i];var a=Math.min(t.life/1.2,1)*0.18;
    ctx.fillStyle='rgba(55,48,38,'+a+')';
    ctx.beginPath();ctx.arc(t.x1,t.sy,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(t.x2,t.sy,2,0,Math.PI*2);ctx.fill();
  }
}

var dust=[];

function spawnDust(){
  if(rover.vx===0&&Math.abs(scrollSpeed)<15)return;
  for(var i=0;i<2;i++){
    var spread=(Math.random()-0.5)*rover.drawSize*0.4;
    /* Dust flies opposite to movement direction */
    var dustDir=scrollSpeed>=0?1:-1;
    dust.push({x:rover.x+spread,y:rover.y+dustDir*rover.drawSize*0.35,
      vx:-rover.vx*0.12+(Math.random()-0.5)*25,
      vy:dustDir*(15+Math.random()*20),
      life:0.5+Math.random()*0.4,maxLife:0.7,r:1.5+Math.random()*2});
  }
}

function updateDust(dt){
  for(var i=dust.length-1;i>=0;i--){
    var p=dust[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.96;p.life-=dt;
    if(p.life<=0)dust.splice(i,1);
  }
}

function drawDust(){
  for(var i=0;i<dust.length;i++){
    var p=dust[i];var a=(p.life/p.maxLife)*0.35;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(150,135,110,'+a+')';ctx.fill();
  }
}

  ctx.lineTo(-s*7,s*3);
  ctx.lineTo(-s*7,s*6);

  ctx.lineTo(s*4,s*9);
  ctx.lineTo(s*7,s*6);
  ctx.lineTo(s*7,s*3);
  ctx.lineTo(s*6,s*1);
  ctx.lineTo(s*3,s*1);

}

function drawHBar(x,y,w,h,pct,color,icon){
  if(icon==='energy') drawLightningIcon(x-14,y+h/2,16,color);
  if(icon==='shield') drawShieldIcon(x-14,y+h/2,18,color);

  /* Track with colored border */
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();
  ctx.strokeStyle=color;ctx.globalAlpha=0.3;ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.stroke();
  ctx.globalAlpha=1;

  /* Fill */
  var fw=w*pct;
  if(fw>0){
    ctx.save();
    ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.clip();
    ctx.fillStyle=color;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.roundRect(x,y,fw,h,h/2);ctx.fill();
    ctx.globalAlpha=0.2;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.roundRect(x,y,fw,h*0.4,h/2);ctx.fill();
    ctx.globalAlpha=1;ctx.restore();
  }
}

function drawHUD(){
  /* === Energy bar (top left) — green or red, no yellow === */
  var barW=W*0.38;
  var barX=28;
  var eC=rover.energy>25?'#00ee77':'#ee3333';
  drawHBar(barX,12,barW,10,rover.energy/100,eC,'energy');

  /* === Hearts (top right, aligned with bars: top=12, bottom=42) === */
  for(var i=0;i<5;i++) drawHeart(W-24-i*30,12,30,i<rover.lives);

  /* === Score (center, below) === */
  ctx.font=fontStr('700',28);
  ctx.textAlign='center';
  ctx.fillStyle='#fff';
  ctx.fillText(score+'/240',W/2,68);
}

function drawPCHint(){
  if(isMobile||gameTime>5)return;
  var a=gameTime<4?0.35:0.35*(5-gameTime);
  ctx.font=fontStr('400',10);ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,'+a+')';
  ctx.fillText('WASD / Arrows \u2014 move',W/2,H-32);
}

/* =====================================================
   INPUT
   ===================================================== */
var inputMove={x:0,y:0};
var inputShield={x:0,y:-1};
var keys={};
var isMobile=('ontouchstart' in window||navigator.maxTouchPoints>0);

window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});

function updateKB(){
  if(isMobile)return;
  var mx=0,my=0;
  if(keys['w']||keys['arrowup'])my=-1;
  if(keys['s']||keys['arrowdown'])my=1;
  if(keys['a']||keys['arrowleft'])mx=-1;
  if(keys['d']||keys['arrowright'])mx=1;
  inputMove.x=mx;inputMove.y=my;
}

canvas.addEventListener('mousemove',function(e){
  if(isMobile)return;
  var r=canvas.getBoundingClientRect();
  inputShield.x=e.clientX-r.left-rover.x;
  inputShield.y=e.clientY-r.top-rover.y;
});

var touch={on:false,id:-1,ox:0,oy:0,cx:0,cy:0,roverStartX:0,roverStartY:0};
var TOUCH_MULT=2.5;
function tpos(t){var r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(touch.on)return;
  var t=e.changedTouches[0],p=tpos(t);
  touch.on=true;touch.id=t.identifier;
  touch.ox=p.x;touch.oy=p.y;touch.cx=p.x;touch.cy=p.y;
  touch.roverStartX=rover.x;
  touch.roverStartY=rover.y;
},{passive:false});

canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],p=tpos(t);
    if(touch.on&&t.identifier===touch.id){
      touch.cx=p.x;touch.cy=p.y;
    }
  }
},{passive:false});

canvas.addEventListener('touchend',function(e){
  for(var i=0;i<e.changedTouches.length;i++){
    if(touch.on&&e.changedTouches[i].identifier===touch.id){
      touch.on=false;
    }
  }
});

function drawJoysticks(){
  /* No joysticks in new control scheme */
}

/* =====================================================
   VFX — screen shake, flashes, sparks, pickup effects
   ===================================================== */
var vfx={
  shake:0,shakeIntensity:0,
  redFlash:0,
  sparks:[],
  burstParticles:[],
  popups:[]
};

function vfxShake(intensity,dur){
  vfx.shake=dur||0.3;
  vfx.shakeIntensity=intensity||6;
}

function vfxRedFlash(){vfx.redFlash=0.5;}

function vfxPickup(x,y,color,text){
  /* Sparks fly upward */
  for(var i=0;i<5;i++){
    var ang=-Math.PI/2+(Math.random()-0.5)*1.2;
    var spd=50+Math.random()*80;
    vfx.sparks.push({
      x:x+(Math.random()-0.5)*8,y:y,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:0.4+Math.random()*0.3,maxLife:0.6,
      r:1.5+Math.random()*2,color:color
    });
  }
  /* Text popup */
  if(text){
    vfx.popups.push({x:x,y:y,text:text,color:color,life:0.8,maxLife:0.8});
  }
}

function vfxSparks(x,y,color,count){
  for(var i=0;i<(count||8);i++){
    var ang=Math.random()*Math.PI*2;
    var spd=60+Math.random()*120;
    vfx.sparks.push({
      x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:0.3+Math.random()*0.3,maxLife:0.5,
      r:1+Math.random()*2,color:color
    });
  }
}

function vfxBurstCollectible(x,y,color,shieldAngle){
  var baseAng=shieldAngle||0;
  for(var i=0;i<7;i++){
    var ang=baseAng+(Math.random()-0.5)*1.5;
    var spd=50+Math.random()*100;
    vfx.burstParticles.push({
      x:x,y:y,
      vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:0.4+Math.random()*0.3,maxLife:0.6,
      r:2+Math.random()*3,color:color
    });
  }
}

function updateVFX(dt){
  if(vfx.shake>0)vfx.shake-=dt;
  if(vfx.redFlash>0)vfx.redFlash-=dt;

  for(var j=vfx.sparks.length-1;j>=0;j--){
    var s=vfx.sparks[j];
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    s.vx*=0.92;s.vy*=0.92;
    s.life-=dt;
    if(s.life<=0)vfx.sparks.splice(j,1);
  }

  for(var k=vfx.burstParticles.length-1;k>=0;k--){
    var p=vfx.burstParticles[k];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=0.9;p.vy*=0.9;
    p.life-=dt;
    if(p.life<=0)vfx.burstParticles.splice(k,1);
  }

  for(var m=vfx.popups.length-1;m>=0;m--){
    var pp=vfx.popups[m];
    pp.y-=40*dt;
    pp.life-=dt;
    if(pp.life<=0)vfx.popups.splice(m,1);
  }
}

function drawVFX(){
  /* Sparks */
  for(var j=0;j<vfx.sparks.length;j++){
    var s=vfx.sparks[j];
    var sa=(s.life/s.maxLife);
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*sa,0,Math.PI*2);
    ctx.fillStyle=s.color;ctx.globalAlpha=sa;ctx.fill();ctx.globalAlpha=1;
  }

  /* Burst particles */
  for(var k=0;k<vfx.burstParticles.length;k++){
    var p=vfx.burstParticles[k];
    var pa=(p.life/p.maxLife);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*pa,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=pa*0.8;ctx.fill();ctx.globalAlpha=1;
  }

  /* Text popups */
  for(var m=0;m<vfx.popups.length;m++){
    var pp=vfx.popups[m];
    var pa2=pp.life/pp.maxLife;
    ctx.font=fontStr('700',14);
    ctx.textAlign='center';
    ctx.fillStyle=pp.color;
    ctx.globalAlpha=pa2;
    ctx.fillText(pp.text,pp.x,pp.y);
    ctx.globalAlpha=1;
  }

  /* Red flash on damage */
  if(vfx.redFlash>0){
    var fa=vfx.redFlash/0.5*0.3;
    ctx.fillStyle='rgba(255,30,30,'+fa+')';
    ctx.fillRect(0,0,W,H);
  }
}

function applyShake(){
  if(vfx.shake>0){
    var intensity=vfx.shakeIntensity*(vfx.shake/0.3);
    var sx=(Math.random()-0.5)*intensity*2;
    var sy=(Math.random()-0.5)*intensity*2;
    ctx.translate(sx,sy);
    return true;
  }
  return false;
}

/* =====================================================
   ENERGY
   ===================================================== */
function updateEnergy(dt){
  rover.energy-=1.5*dt;
  if(rover.energy<=0){
    rover.energy=100;rover.lives--;rover.invuln=1.5;
    if(rover.lives<0)rover.lives=0;
    vfxShake(6,0.25);vfxRedFlash();
  }
}

/* =====================================================
   GAME OVER
   ===================================================== */
var gameOver=false;
var gameOverWin=false;
var gameOverFade=0;
var meteorsBlocked=0;
var scoreSubmitted=false;

/* Platform integration via postMessage (iframe) */
function submitScore(){
  if(scoreSubmitted)return;
  scoreSubmitted=true;
  window.parent.postMessage({type:'SUBMIT_SCORE',score:score},'*');
}

function checkGameOver(){
  if(gameOver)return;
  if(rover.lives<=0){gameOver=true;gameOverWin=false;gameOverFade=0;submitScore();}
  if(score>=240){gameOver=true;gameOverWin=true;gameOverFade=0;submitScore();}
}

function drawGameOver(dt){
  gameOverFade=Math.min(1,gameOverFade+dt*1.5);
  var a=gameOverFade;

  /* Dark overlay */
  ctx.fillStyle='rgba(6,4,15,'+(a*0.85)+')';
  ctx.fillRect(0,0,W,H);

  if(a<0.3)return;
  var ta=(a-0.3)/0.7;

  /* Title */
  ctx.globalAlpha=ta;
  ctx.font=fontStr('700',gameOverWin?22:28);
  ctx.textAlign='center';
  ctx.fillStyle=gameOverWin?'#FFA91F':'#ff4466';
  ctx.fillText(gameOverWin?'MISSION COMPLETE!':'GAME OVER',W/2,H*0.22);

  /* Score */
  ctx.font=fontStr('700',42);
  ctx.fillStyle='#fff';
  ctx.fillText(score+'/240',W/2,H*0.34);

  /* Stars visualization */
  var starCount=Math.ceil(score/48);
  if(starCount>5)starCount=5;
  var starW=starCount*32;
  var starX=(W-starW)/2+16;
  for(var i=0;i<5;i++){
    var sx=starX+i*32;
    var sy2=H*0.41;
    ctx.beginPath();
    for(var p=0;p<10;p++){
      var ang=(p/10)*Math.PI*2-Math.PI/2;
      var r=p%2===0?12:5;
      if(p===0)ctx.moveTo(sx+Math.cos(ang)*r,sy2+Math.sin(ang)*r);
      else ctx.lineTo(sx+Math.cos(ang)*r,sy2+Math.sin(ang)*r);
    }
    ctx.closePath();
    if(i<starCount){ctx.fillStyle='#ffd700';ctx.fill();}
    else{ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.stroke();}
  }

  /* Stats */
  ctx.font=fontStr('400',11);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  var minutes=Math.floor(gameTime/60);
  var seconds=Math.floor(gameTime%60);
  var timeStr=(minutes<10?'0':'')+minutes+':'+(seconds<10?'0':'')+seconds;
  ctx.fillText('Time: '+timeStr,W/2,H*0.52);
  ctx.fillText('Meteors blocked: '+meteorsBlocked,W/2,H*0.57);

  /* Buttons */
  if(ta>0.8){
    var btnA=Math.min(1,(ta-0.8)/0.2);
    ctx.globalAlpha=btnA;

    /* Play Again */
    var bw=180,bh=48,bx=W/2-bw/2,by=H*0.65;
    ctx.fillStyle='#FFA91F';
    ctx.beginPath();ctx.roundRect(bx,by,bw,bh,24);ctx.fill();
    ctx.font=fontStr('700',15);
    ctx.fillStyle='#0a0816';ctx.textAlign='center';
    ctx.fillText('PLAY AGAIN',W/2,by+bh/2+5);

    /* Exit */
    var by2=H*0.75;
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(bx,by2,bw,bh,24);ctx.stroke();
    ctx.font=fontStr('500',13);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('EXIT',W/2,by2+bh/2+4);

    /* Store button positions for click */
    gameOverBtns={
      again:{x:bx,y:by,w:bw,h:bh},
      exit:{x:bx,y:by2,w:bw,h:bh}
    };
  }
  ctx.globalAlpha=1;
}

var gameOverBtns=null;

function handleGameOverClick(px,py){
  if(!gameOverBtns)return;
  var b=gameOverBtns;
  if(px>b.again.x&&px<b.again.x+b.again.w&&py>b.again.y&&py<b.again.y+b.again.h){
    location.reload();
  }
  if(px>b.exit.x&&px<b.exit.x+b.exit.w&&py>b.exit.y&&py<b.exit.y+b.exit.h){
    window.location.href='index.html';
  }
}

canvas.addEventListener('click',function(e){
  if(!gameOver)return;
  var r=canvas.getBoundingClientRect();
  handleGameOverClick(e.clientX-r.left,e.clientY-r.top);
});

canvas.addEventListener('touchend',function(e){
  if(!gameOver)return;
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var r=canvas.getBoundingClientRect();
    handleGameOverClick(t.clientX-r.left,t.clientY-r.top);
  }
});

/* =====================================================
   GAME LOOP
   ===================================================== */
var gameTime=0,lastTime=0;
/* =====================================================
   LOADING — wait for rover image + font
   ===================================================== */
var loadScreen=document.getElementById('load-screen');
var loadBar=document.getElementById('load-bar');
var assetsReady=false;
var loadPct=0;

var roverLoaded=false;
var fontLoaded=false;

roverImg.onload=function(){roverLoaded=true;};
roverImg.onerror=function(){roverLoaded=true;}; /* continue even if image fails */

document.fonts.ready.then(function(){fontLoaded=true;});

function checkLoading(){
  var progress=0;
  if(roverLoaded)progress+=50;
  if(fontLoaded)progress+=50;
  loadPct+=(progress-loadPct)*0.2;
  loadBar.style.width=Math.round(loadPct)+'%';

  if(roverLoaded&&fontLoaded&&!assetsReady){
    assetsReady=true;
    loadBar.style.width='100%';
    setTimeout(function(){
      loadScreen.style.opacity='0';
      setTimeout(function(){
        loadScreen.style.display='none';
        startGame();
      },500);
    },300);
  }

  if(!assetsReady)requestAnimationFrame(checkLoading);
}
requestAnimationFrame(checkLoading);

function startGame(){
  resize();initRover();nextCollectWY=scrollY+H;nextIslandWY=scrollY+H*5;
  requestAnimationFrame(loop);
}

function loop(ts){
  if(!lastTime)lastTime=ts;
  var dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;

  if(!gameOver){
    gameTime+=dt;
    scrollY+=scrollSpeed*dt;
    updateKB();updateRover(dt);updateEnergy(dt);
    updateMeteors(dt);updateCollectibles(dt);
    spawnDust();updateDust(dt);updateTracks(dt);
    updateImpactDust(dt);cleanObstacles();
    spawnIslands();spawnIslandCollectibles();checkIslandCollision();
    updateVFX(dt);
    checkGameOver();
  }

  ctx.save();
  if(!gameOver)applyShake();

  drawCanyon();drawObstacles();drawIslands();drawCollectibles();drawTracks();drawDust();
  drawImpactDust();drawMeteors();
  drawRover();drawVFX();
  if(!gameOver)drawJoysticks();
  drawHUD();
  if(!gameOver)drawPCHint();

  ctx.restore();

  if(gameOver)drawGameOver(dt);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
